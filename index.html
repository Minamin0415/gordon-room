<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202b35">
  <meta name="description" content="小さなゴードンと遊び、世話をし、部屋での暮らしを眺めるPWA。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>ゴードンの部屋</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">A QUIET LITTLE ROOM</p>
        <h1>ゴードンの部屋</h1>
      </div>
      <span id="time-label" class="time-label">今</span>
    </header>

    <section class="room" aria-label="ゴードンの部屋">
      <div class="room-glow" aria-hidden="true"></div>
      <div class="room-set" aria-hidden="true">
        <div class="wall-molding"></div>
        <div class="wall-picture"><i></i></div>
        <div class="floor-lamp"><i class="lamp-shade"></i><i class="lamp-neck"></i><i class="lamp-base"></i></div>
        <div class="travel-trunk"><i class="trunk-latch"></i></div>
        <div id="room-gadgets" class="room-gadgets"></div>
        <div class="meal-setting"><i></i></div>
        <div class="soft-rug"></div>
        <div class="rug-cushion"></div>
      </div>
      <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
      <output id="idle-debug" class="idle-debug" aria-hidden="true" hidden></output>
      <div class="room-line room-line-left" aria-hidden="true"></div>
      <div class="room-line room-line-right" aria-hidden="true"></div>
      <button id="gordon" class="gordon" type="button" aria-label="ゴードンをタップする">
        <span class="gordon-figure">
          <img id="gordon-sprite" src="./assets/gordon/gordon-idle.png" alt="立っているゴードン" draggable="false">
          <span class="eyelid" aria-hidden="true"></span>
        </span>
      </button>
      <div id="emote" class="emote" aria-hidden="true"></div>
      <div id="effect-layer" class="effect-layer" aria-hidden="true"></div>
      <div id="held-gadget" class="held-gadget" aria-hidden="true" hidden></div>
      <div id="condition-cue" class="condition-cue" aria-hidden="true"></div>
      <div id="sleep-mark" class="sleep-mark" aria-hidden="true">z z z</div>
      <div class="floor" aria-hidden="true"></div>
      <p class="room-note"></p>
    </section>

    <section class="speech" aria-label="ゴードンの台詞">
      <span class="speech-name">GORDON</span>
      <span id="speech-mark" class="speech-mark" aria-hidden="true">✧</span>
      <p id="speech-text" aria-live="polite">……来たのか。</p>
    </section>

    <section id="activity-panel" class="activity-panel" aria-label="あそびと持ち物" hidden>
      <div class="activity-header"><div><span class="activity-kicker">WITH GORDON</span><h2 id="activity-title"></h2></div><button id="panel-close" class="panel-close" type="button" aria-label="閉じる">×</button></div>
      <div id="activity-content"></div>
    </section>

    <section class="status" aria-label="ゴードンの状態">
      <div class="section-heading"><span>きょうの様子</span><span id="state-caption">いつもどおり</span></div>
      <div class="status-grid">
        <div class="status-item"><span class="status-icon" aria-hidden="true">◐</span><span class="status-label">おなか</span><span id="hunger-label" class="status-value">ふつう</span></div>
        <div class="status-item"><span class="status-icon" aria-hidden="true">✦</span><span class="status-label">元気</span><span id="energy-label" class="status-value">ふつう</span></div>
        <div class="status-item"><span class="status-icon" aria-hidden="true">◌</span><span class="status-label">機嫌</span><span id="mood-label" class="status-value">ふつう</span></div>
        <div class="status-item"><span class="status-icon" aria-hidden="true">⌁</span><span class="status-label">興味</span><span id="interest-label" class="status-value">ふつう</span></div>
      </div>
    </section>

    <nav class="actions" aria-label="ゴードンのコマンド">
      <button type="button" id="feed-btn" class="action"><svg class="action-icon" viewBox="0 0 42 42" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 24h21c-.7 6-4.2 9-10.5 9S13.7 30 13 24Z"/><path d="M15 35h17M18 19c-2-2-1-3 0-5m7 5c-2-2-1-3 0-5"/><path d="M8 13v12m-3-12v6m6-6v6M5 19c0 3 6 3 6 0"/><circle cx="28" cy="21" r="1" fill="currentColor" stroke="none"/></svg><span>飯</span></button>
      <button type="button" id="play-btn" class="action"><svg class="action-icon" viewBox="0 0 42 42" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="18" height="24" rx="3" transform="rotate(-7 18 21)"/><path d="M19 13h12a3 3 0 0 1 3 3v18a3 3 0 0 1-3 3H19M15 18l3-3 3 3-3 3zM27 26l3-3 3 3-3 3z"/></svg><span>あそぶ</span></button>
      <button type="button" id="gadget-btn" class="action"><svg class="action-icon" viewBox="0 0 42 42" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17h24v17H9zM13 17l5-8h6l5 8M15 25h12M15 29h8M30 22h5v6h-5"/><circle cx="28" cy="29" r="1" fill="currentColor" stroke="none"/></svg><span>ガジェット</span></button>
      <button type="button" id="pet-btn" class="action"><svg class="action-icon" viewBox="0 0 42 42" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m21 25 5-12a2 2 0 0 1 3.7 1.4l-2.3 6 2-3.4a2 2 0 0 1 3.5 1.8l-2.1 4.3 1.3-1.7a2 2 0 0 1 3.2 2.3l-5 8c-2.4 4-6.4 5-10.5 3.5l-6.6-2.5a2.4 2.4 0 0 1 1.7-4.5l5 1.4-2.5-2a2 2 0 0 1 2.5-3.2Z"/><path d="M9 10v5m-2.5-2.5h5M15 6v3m-1.5-1.5h3"/></svg><span>なでる</span></button>
      <button type="button" id="rest-btn" class="action"><svg class="action-icon" viewBox="0 0 42 42" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M24 7a11 11 0 1 0 10 17A11 11 0 0 1 24 7Z"/><path d="M8 32c3-2 7-3 13-3s10 1 13 3v4H8v-4Z"/><path d="M12 26h4l-4 4h4M31 8h3l-3 3h3"/></svg><span>休ませる</span></button>
    </nav>

    <footer class="footer">
      <span id="save-label">この端末に保存中</span>
      <button type="button" id="reset-btn" class="reset-button">データを初期化</button>
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
