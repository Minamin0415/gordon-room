<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202b35">
  <meta name="description" content="小さなゴードンと遊び、世話をし、部屋での暮らしを眺めるPWA。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>ゴードンの部屋</title>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">ちいさな同居人</p>
        <h1>ゴードンの部屋</h1>
      </div>
      <span id="time-label" class="time-label">今</span>
    </header>

    <section class="room" aria-label="ゴードンの部屋">
      <span class="room-plaque" aria-hidden="true">GORDON <i>·</i> 01</span>
      <div class="room-glow" aria-hidden="true"></div>
      <div class="room-set" aria-hidden="true">
        <div class="wall-molding"></div>
        <div class="wall-picture"><i></i></div>
        <div class="floor-lamp"><i class="lamp-shade"></i><i class="lamp-neck"></i><i class="lamp-base"></i></div>
        <div class="travel-trunk"><i class="trunk-latch"></i></div>
        <div id="room-gadgets" class="room-gadgets"></div>
        <div class="meal-setting"><i></i></div>
        <div class="soft-rug"></div>
        <div class="rug-cushion"></div>
      </div>
      <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
      <output id="idle-debug" class="idle-debug" aria-hidden="true" hidden></output>
      <div class="room-line room-line-left" aria-hidden="true"></div>
      <div class="room-line room-line-right" aria-hidden="true"></div>
      <button id="gordon" class="gordon" type="button" aria-label="ゴードンをタップする">
        <span class="gordon-figure">
          <img id="gordon-sprite" src="./assets/gordon/gordon-idle.png" alt="立っているゴードン" draggable="false">
          <span class="eyelid" aria-hidden="true"></span>
        </span>
      </button>
      <div id="emote" class="emote" aria-hidden="true"></div>
      <div id="effect-layer" class="effect-layer" aria-hidden="true"></div>
      <div id="condition-cue" class="condition-cue" aria-hidden="true"></div>
      <div id="sleep-mark" class="sleep-mark" aria-hidden="true">z z z</div>
      <div class="floor" aria-hidden="true"></div>
      <p class="room-note"></p>
    </section>

    <section class="speech" aria-label="ゴードンの台詞">
      <span class="speech-name">ゴードン</span>
      <span id="speech-mark" class="speech-mark" aria-hidden="true">✧</span>
      <p id="speech-text" aria-live="polite">……来たのか。</p>
    </section>

    <section id="activity-panel" class="activity-panel" aria-label="あそびと持ち物" hidden>
      <div class="activity-header"><div><span class="activity-kicker">ゴードンとひと息</span><h2 id="activity-title"></h2></div><button id="panel-close" class="panel-close" type="button" aria-label="閉じる">×</button></div>
      <div id="activity-content"></div>
    </section>

    <section class="status" aria-label="ゴードンの状態">
      <div class="section-heading"><span>きょうの様子</span><span id="state-caption">いつもどおり</span></div>
      <div class="status-grid">
        <div class="status-item"><span class="status-icon" aria-hidden="true">◕</span><span class="status-label">おなか</span><span id="hunger-label" class="status-value">ふつう</span><span id="hunger-meter" class="status-meter" role="meter" aria-label="おなか" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><i></i></span></div>
        <div class="status-item"><span class="status-icon" aria-hidden="true">✦</span><span class="status-label">元気</span><span id="energy-label" class="status-value">ふつう</span><span id="energy-meter" class="status-meter" role="meter" aria-label="元気" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><i></i></span></div>
        <div class="status-item"><span class="status-icon" aria-hidden="true">♪</span><span class="status-label">機嫌</span><span id="mood-label" class="status-value">ふつう</span><span id="mood-meter" class="status-meter" role="meter" aria-label="機嫌" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><i></i></span></div>
        <div class="status-item"><span class="status-icon" aria-hidden="true">✧</span><span class="status-label">興味</span><span id="interest-label" class="status-value">ふつう</span><span id="interest-meter" class="status-meter" role="meter" aria-label="興味" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><i></i></span></div>
      </div>
    </section>

    <nav class="actions" aria-label="ゴードンのコマンド">
      <button type="button" id="feed-btn" class="action"><svg class="action-icon" viewBox="0 0 44 44" aria-hidden="true"><path d="M8 24h28c-1 9-5 13-14 13S9 33 8 24Z" fill="#daccad"/><path d="M9 25h26" stroke="#f3e8cb" stroke-width="2"/><ellipse cx="22" cy="24" rx="14" ry="3" fill="#8a7461"/><path d="M12 23q3-10 11-7 6-3 10 7" fill="#b8bea0"/><path d="m20 19 5 3m-10 0 3-3" stroke="#dfcc9f" stroke-width="2" stroke-linecap="round"/><path d="M17 12c-3-3 3-4 0-7m10 7c-3-3 3-4 0-7" fill="none" stroke="#ddcfb3" stroke-width="2" stroke-linecap="round"/><path d="M15 38h15" stroke="#ad9983" stroke-width="3" stroke-linecap="round"/></svg><span>飯</span></button>
      <button type="button" id="play-btn" class="action"><svg class="action-icon" viewBox="0 0 44 44" aria-hidden="true"><rect x="6" y="9" width="23" height="29" rx="5" fill="#96b9b8" transform="rotate(-12 18 23)"/><rect x="16" y="7" width="23" height="30" rx="5" fill="#e5d6bb" transform="rotate(9 28 22)"/><path d="m28 15 6 7-6 7-6-7Z" fill="#b48173"/><circle cx="22" cy="12" r="1.5" fill="#b48173"/><circle cx="33" cy="32" r="1.5" fill="#b48173"/></svg><span>あそぶ</span></button>
      <button type="button" id="gadget-btn" class="action"><img class="action-icon gadget-action-icon" src="./assets/gadgets/room-radio.svg" alt="" aria-hidden="true"><span>ガジェット</span></button>
      <button type="button" id="pet-btn" class="action"><svg class="action-icon" viewBox="0 0 44 44" aria-hidden="true"><path d="m18 27 5-14q1-3 4-2 2 1 1 4l-2 6 3-5q2-2 4 0 1 1 0 3l-2 5 2-3q2-2 4 0 1 1 0 3l-6 10q-4 7-12 4L9 34q-4-2-1-5 1-1 4 0l5 1-3-3q-2-3 1-4 2-1 3 4Z" fill="#d8bba6"/><path d="M15 37q6 4 11 1" fill="none" stroke="#a68c83" stroke-width="2" stroke-linecap="round"/><path d="m10 7 2 4 4 2-4 2-2 4-2-4-4-2 4-2Z" fill="#d8c78f"/><path d="M19 5v4m-2-2h4" stroke="#b5cfcb" stroke-width="1.5" stroke-linecap="round"/></svg><span>なでる</span></button>
      <button type="button" id="rest-btn" class="action"><svg class="action-icon" viewBox="0 0 44 44" aria-hidden="true"><path d="M28 5a13 13 0 1 0 10 20C26 29 20 16 28 5Z" fill="#e1c68e"/><path d="M8 31q13-6 29 0v7q-14 3-29 0Z" fill="#91acb2"/><path d="M11 32q11 3 23 0" fill="none" stroke="#c1cfd0" stroke-width="1.5" stroke-linecap="round"/><path d="m34 6 1 3 3 1-3 1-1 3-1-3-3-1 3-1Z" fill="#e4d8b9"/></svg><span>休ませる</span></button>
    </nav>

    <footer class="footer">
      <span id="save-label">この端末に保存中</span>
      <button type="button" id="reset-btn" class="reset-button">データを初期化</button>
    </footer>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
